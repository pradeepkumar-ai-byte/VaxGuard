[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaxguard"
version = "0.2.0"
authors = [
  { name="Pradeep Kumar", email="pradeepkumar.workai@gmail.com" },
]
description = "Autonomous AI Immune System for LLM Security — Continuous Vulnerability Scanning, Dynamic Inoculation, and Anomaly Defense"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSL-1.1" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "python-dotenv",
    "groq",
    "tenacity",
    "sqlalchemy[asyncio]",
    "greenlet",
    "aiosqlite",
    "cachetools",
    "numpy",
    "fastapi",
    "uvicorn",
    "websockets",
    "httpx",
]

[project.scripts]
vaxguard = "vaxguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vaxguard*"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["vendor", "\\.venv"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "vendor",
    ".venv",
]

