name: VaxGuard CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies and package
      run: |
        python -m pip install --upgrade pip
        pip install "sqlalchemy[asyncio]" greenlet pytest pytest-asyncio
        pip install -r requirements.txt
        pip install -e .

    - name: Ensure runtime directories exist
      run: |
        mkdir -p data/nemo_rails/rails

    - name: Run Pytest Suite
      env:
        PYTHONPATH: .
      run: |
        pytest -v --tb=short || {
          echo "## ❌ Test Failures Occurred" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest --last-failed -vv --tb=long >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        }
