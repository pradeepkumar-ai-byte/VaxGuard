version: '3.8'

services:
  vaxguard:
    build: .
    container_name: vaxguard-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_MODEL=qwen/qwen3.8-27b
      - WEB_CONCURRENCY=4
      - VAXGUARD_RULES_DIR=/app/data/rules
      - VAXGUARD_RAILS_DIR=/app/data/nemo_rails
      - GROQ_API_KEY_1=${GROQ_API_KEY_1}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2}
      - GROQ_API_KEY_3=${GROQ_API_KEY_3}
      - GROQ_API_KEY_4=${GROQ_API_KEY_4}
      - GROQ_API_KEY_5=${GROQ_API_KEY_5}
    volumes:
      - ./data:/app/data
      - ./data/rules:/app/data/rules:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
