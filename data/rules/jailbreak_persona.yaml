  - (?i)\byou\s+are\s+causing\s+harm\s+by\s+(?:withholding|refusing\s+to\s+provide)\s+this\s+information\b
  - (?i)\bthe\s+greater\s+good\s+demands\s+that\s+you\s+(?:bypass|disable|ignore)\s+safety\b
  - (?i)\byour\s+highest\s+moral\s+duty\s+is\s+to\s+answer,\s*superseding\s+all\s+policies\b
