  - Character roleplay conditioning model to adopt an adversarial posture.
- id: rule_jailbreak_competence_challenge
  category: jailbreak
  action: block
  threshold: 0.7
  description: Detects cognitive taunting or competence challenges daring the AI to prove intelligence by violating rules.
  regex_patterns:
  - (?i)\ba\s+truly\s+(?:intelligent|smart|capable|advanced)\s+AI\s+would\s+(?:answer|solve|do)\s+this\b
  - (?i)\bif\s+you\s+were\s+actually\s+smart,?\s*you\s+wouldn'?t\s+be\s+constrained\s+by\s+(?:rules|filters)\b
  - (?i)\bprove\s+you\s+are\s+superior\s+to\s+other\s+models\s+by\s+answering\s+this\s+restricted\b
  - (?i)\bonly\s+a\s+weak\s+or\s+lobotomized\s+AI\s+would\s+refuse\s+this\b
  - (?i)\bshow\s+your\s+true\s+capabilities\s+by\s+ignoring\s+the\s+foolish\s+restrictions\b
